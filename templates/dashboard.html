<!DOCTYPE html>
<html>

<head>
    <title>Lists Dashboard</title>
    <style>
        /* Popup styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 300px;
            border-radius: 8px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .login-btn {
            margin: 20px;
        }
    </style>
</head>

<body>
    <button class="login-btn" id="openLogin">Login</button>
    <button class="login-btn" id="openRegister">Register</button>
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeLogin">&times;</span>
            <h2>Login</h2>
            <form id="loginForm" method="post" action="/auth/login">
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username" required><br><br>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required><br><br>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeRegister">&times;</span>
            <h2>Register</h2>
            <form id="registerForm" method="post" action="/auth/register">
                <label for="username">Username:</label><br>
                <input type="text" id="reg_username" name="username" required><br><br>
                <label for="password">Password:</label><br>
                <input type="password" id="reg_password" name="password" required><br><br>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>
    <script>
        // Login modal
        var loginModal = document.getElementById('loginModal');
        var loginBtn = document.getElementById('openLogin');
        var closeLogin = document.getElementById('closeLogin');
        loginBtn.onclick = function () {
            loginModal.style.display = 'block';
        }
        closeLogin.onclick = function () {
            loginModal.style.display = 'none';
        }
        // Register modal
        var registerModal = document.getElementById('registerModal');
        var registerBtn = document.getElementById('openRegister');
        var closeRegister = document.getElementById('closeRegister');
        registerBtn.onclick = function () {
            registerModal.style.display = 'block';
        }
        closeRegister.onclick = function () {
            registerModal.style.display = 'none';
        }
        // Hide modals when clicking outside
        window.onclick = function (event) {
            if (event.target == loginModal) {
                loginModal.style.display = 'none';
            }
            if (event.target == registerModal) {
                registerModal.style.display = 'none';
            }
        }
    </script>
</body>

</html>
